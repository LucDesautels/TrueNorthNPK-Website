<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About &amp; Contact - True North NPK</title>
  <meta name="description" content="Meet True North NPK - Noel, Paul and Kevin - and get in touch.">
  <link rel="icon" href="assets/img/badge.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/controls.js"></script>
  <script src="js/analytics.js"></script>
</head>
<body data-page="about">

  <header id="site-header"></header>

  <main>
    <!-- ABOUT -->
    <section class="section about-hero">
      <div class="container">
        <h1>About the Band</h1>
        <div class="band-block">
          <div class="band-photo">
            <img src="assets/img/band-placeholder.jpg" alt="True North NPK band photo placeholder">

          </div>
          <div class="band-text">
            <p data-content="about.paragraph1"></p>
            <p data-content="about.paragraph2"></p>
          </div>
        </div>
        <div class="titanium-bar thin divider-ti" style="max-width:240px;margin-top:18px"></div>
      </div>
    </section>

    <!-- MEMBERS -->
    <section class="section" style="padding-top:0">
      <div class="container">
        <h2>The Members</h2>
        <p class="lead" data-content="about.membersSectionLead"></p>
        <div class="members-grid" id="members-grid"><!-- filled by script --></div>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="section contact-section" id="contact">
      <div class="container">
        <h2>Contact</h2>
        <div class="contact-grid">
          <div class="contact-info">
            <!-- email + Listen URL come from js/content.js -->
            <div class="contact-detail">
              <p class="cd-label">Email</p>
              <p class="cd-value"><a href="mailto:" data-content-email></a></p>
            </div>
            <div class="contact-detail">
              <p class="cd-label">Listen</p>
              <p class="cd-value"><a href="#" data-content-listen target="_blank" rel="noopener"></a></p>
            </div>
            <div class="contact-detail">
              <p class="cd-label">Buy / Download</p>
              <p class="cd-value"><a href="#" data-content-bandcamp target="_blank" rel="noopener"></a></p>
            </div>
            <div class="contact-detail">
              <p class="cd-label">Instagram</p>
              <p class="cd-value"><a href="#" data-content-instagram target="_blank" rel="noopener"></a></p>
            </div>
          </div>

          <form class="contact-form" id="contact-form" novalidate>
            <div class="form-row">
              <div class="form-field">
                <label for="cf-name">Name</label>
                <input type="text" id="cf-name" name="name" required>
              </div>
              <div class="form-field">
                <label for="cf-email">Your Email</label>
                <input type="email" id="cf-email" name="email" required>
              </div>
            </div>
            <div class="form-field">
              <label for="cf-subject">Subject</label>
              <input type="text" id="cf-subject" name="subject">
            </div>
            <div class="form-field">
              <label for="cf-message">Message</label>
              <textarea id="cf-message" name="message" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Send message</button>
            <p class="form-status" id="cf-status" role="status"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/content.js"></script>
  <script src="js/data.js"></script>
  <script src="js/shared.js"></script>
  <script>
    /* render member cards from js/data.js */
    (function () {
      document.getElementById("members-grid").innerHTML = MEMBERS.map(function (m) {
        var linkHtml = "";
        if (m.link && m.link.url) {
          linkHtml = '<p class="member-link">' +
            '<a href="' + m.link.url + '" target="_blank" rel="noopener">' +
              (m.link.label || m.link.url) +
            '</a></p>';
        }
        return '' +
          '<article class="member-card">' +
            '<div class="member-photo">' +
              '<img class="photo-main" src="' + m.photo + '" alt="' + m.name + '">' +
              '<img class="photo-hover" src="' + m.photoHover + '" alt="" aria-hidden="true">' +
            '</div>' +
            '<div class="member-info">' +
              '<h3>' + m.name + '</h3>' +
              '<p class="member-role">' + m.role + '</p>' +
              '<p>' + m.bio + '</p>' +
              linkHtml +
            '</div>' +
          '</article>';
      }).join("");
    })();

    /* contact form -> opens the user's email client (no backend needed) */
    (function () {
      var form = document.getElementById("contact-form");
      var status = document.getElementById("cf-status");
      var TO = (window.CONTENT && CONTENT.contact && CONTENT.contact.email)
               || "contact@truenorthnpk.com";
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var name = form.name.value.trim();
        var email = form.email.value.trim();
        var msg = form.message.value.trim();
        if (!name || !email || !msg) {
          status.style.color = "#e8923a";
          status.textContent = "Please fill in your name, email and message.";
          return;
        }
        var subject = form.subject.value.trim() || ("Message from " + name);
        var body = "From: " + name + " (" + email + ")\n\n" + msg;
        window.location.href = "mailto:" + TO +
          "?subject=" + encodeURIComponent(subject) +
          "&body=" + encodeURIComponent(body);
        status.style.color = "";
        status.textContent = "Opening your email app…";
      });
    })();
  </script>
</body>
</html>
